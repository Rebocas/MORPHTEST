name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Extrair o projeto
        run: |
          unzip -q ./*.zip
          ls morphmod
          find morphmod -name "*.java" | head -30

      - name: Compilar
        working-directory: morphmod
        run: gradle build --no-daemon --stacktrace

      - name: Conteudo do jar
        run: |
          for f in morphmod/build/libs/*.jar; do unzip -l "$f" | head -40; done

      - name: Enviar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: morphmod-jar
          path: morphmod/build/libs/*.jar
