plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.morphmod'
base { archivesName = 'morphmod-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    // Para testar com o TaCZ no ambiente de desenvolvimento (opcional):
    // maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // TaCZ e opcional. Para rodar junto no runClient, descomente e coloque o ID do arquivo do CurseForge:
    // runtimeOnly fg.deobf("curse.maven:timeless-and-classics-zero-1028108:<FILE_ID>")
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title'   : 'morphmod',
        'Specification-Vendor'  : 'morphmod',
        'Specification-Version' : '1',
        'Implementation-Title'  : project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor' : 'morphmod'
    ])
    finalizedBy 'reobfJar'
}
