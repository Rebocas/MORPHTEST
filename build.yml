name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Diagnostico
        run: |
          echo "=== raiz ==="
          ls -la
          echo "=== arquivos .java ==="
          find . -name "*.java" | head -50
          echo "=== mods.toml ==="
          find . -name "mods.toml"
          echo "=== build.gradle ==="
          cat build.gradle

      - name: Compilar
        run: gradle build --no-daemon --stacktrace

      - name: Conteudo do jar
        run: |
          for f in build/libs/*.jar; do unzip -l "$f" | head -40; done

      - name: Enviar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: morphmod-jar
          path: build/libs/*.jar

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
